<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión - TeleConnect Telecomunicaciones</title>
  <link rel="stylesheet" href="/static/css/google-meet.css">
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card-meet">
      <div class="auth-header">
        <!-- Logo Propio de Telecomunicaciones -->
        <div style="display: flex; justify-content: center; margin-bottom: 14px;">
          <div style="width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(135deg, #1e40af, #38bdf8); display: flex; align-items: center; justify-content: center; color: #ffffff; box-shadow: 0 8px 20px rgba(30, 64, 175, 0.4);">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/>
              <circle cx="12" cy="11" r="3"/>
              <path d="M17 9l3-2v8l-3-2"/>
            </svg>
          </div>
        </div>
        <h1 class="auth-title">TeleConnect</h1>
        <p class="auth-subtitle">Plataforma Segura de Videoconferencias</p>
      </div>

      {% if error_message %}
      <div style="background-color: #fef2f2; color: #b91c1c; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; border: 1px solid #fecaca;">
        {{ error_message }}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="form-group-meet">
          <label class="form-label-meet">Correo Electrónico</label>
          {{ form.email }}
        </div>

        <div class="form-group-meet">
          <label class="form-label-meet">Contraseña</label>
          {{ form.password }}
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 26px; margin-bottom: 24px;">
          <a href="{% url 'register' %}" style="color: #2563eb; font-size: 14px; font-weight: 600; text-decoration: none;">
            Crear cuenta nueva
          </a>
          <button type="submit" class="btn-card-start" style="padding: 10px 28px; font-size: 14px;">
            Iniciar sesión
          </button>
        </div>
      </form>

      <div style="border-top: 1px solid var(--border-light); padding-top: 18px; text-align: center;">
        <span class="vpn-status-badge badge-vpn-connected" style="font-size: 11px;">
          🔒 Acceso Protegido por VPN y Cifrado TLS 1.3
        </span>
      </div>
    </div>
  </div>
</body>
</html>
