<!-- Modal de Configuración de Periféricos (Audio y Video) - Estilo Navy Telecom -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal-box-meet">
    <!-- Encabezado Azul Marino -->
    <div class="modal-header-meet">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <h2 class="modal-title-meet">Configuración de Periféricos</h2>
      </div>
      <button type="button" class="modal-close-btn" id="closeSettingsBtn" title="Cerrar" onclick="if(window.deviceManager){window.deviceManager.stopAudioMeter();window.deviceManager.stopCameraPreview();} document.getElementById('settingsModal').classList.remove('show');">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Contenido en 2 columnas -->
    <div class="modal-body-meet">
      <!-- Barra lateral izquierda (Audio y Video) -->
      <div class="settings-tabs-sidebar">
        <button type="button" class="settings-tab-btn active" id="tabAudioBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          Audio y Micrófono
        </button>
        <button type="button" class="settings-tab-btn" id="tabVideoBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          Cámara de Video
        </button>
      </div>

      <!-- Panel derecho de contenido -->
      <div class="settings-tab-content-area">
        
        <!-- Pestaña AUDIO -->
        <div id="settingsContentAudio">
          <!-- Sección Micrófono -->
          <div class="settings-section-block">
            <div class="settings-section-title">Dispositivo de Micrófono</div>
            <div class="settings-field-row">
              <div class="settings-select-wrapper">
                <span class="settings-select-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  </svg>
                </span>
                <select class="settings-select" id="micSelect">
                  <option value="">Detectando micrófonos...</option>
                </select>
              </div>

              <!-- Indicador de Vúmetro de audio (3 puntos cyan/navy) -->
              <div class="audio-meter-dots" title="Medidor de voz en vivo">
                <div class="meter-dot"></div>
                <div class="meter-dot"></div>
                <div class="meter-dot"></div>
              </div>
            </div>
            <small style="color: var(--text-muted); font-size: 12px;">Habla para verificar el nivel de entrada en los indicadores dinámicos.</small>
          </div>

          <!-- Sección Bocina -->
          <div class="settings-section-block">
            <div class="settings-section-title">Salida de Audio (Bocina / Auriculares)</div>
            <div class="settings-field-row">
              <div class="settings-select-wrapper">
                <span class="settings-select-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </span>
                <select class="settings-select" id="speakerSelect">
                  <option value="">Detectando bocinas...</option>
                </select>
              </div>

              <button type="button" class="btn-test-speaker" id="testSpeakerBtn">
                🔊 Probar
              </button>
            </div>
          </div>
        </div>

        <!-- Pestaña VIDEO -->
        <div id="settingsContentVideo" style="display: none;">
          <div class="settings-section-block">
            <div class="settings-section-title">Cámara Web</div>
            <div class="settings-field-row">
              <div class="settings-select-wrapper">
                <span class="settings-select-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                  </svg>
                </span>
                <select class="settings-select" id="cameraSelect">
                  <option value="">Detectando cámaras...</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Previsualización en vivo de la cámara -->
          <div class="video-preview-container">
            <video id="settingsVideoPreview" autoplay playsinline muted style="display: none;"></video>
            <div class="video-preview-placeholder" id="videoPreviewPlaceholder">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <span>Vista previa en tiempo real activa</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
