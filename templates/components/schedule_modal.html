<!-- Modal para Programar una Sesión Virtual en Calendario - Estilo Navy -->
<div class="modal-backdrop" id="scheduleModal">
  <div class="modal-box-meet" style="width: 560px;">
    <div class="modal-header-meet">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <h2 class="modal-title-meet">Programar Sesión Virtual</h2>
      </div>
      <button type="button" class="modal-close-btn" id="closeScheduleBtn" title="Cerrar">&times;</button>
    </div>

    <form id="scheduleMeetingForm" class="p-4 sm:p-8">
      <div class="form-group-meet">
        <label class="form-label-meet">Título de la Sesión</label>
        <input type="text" name="title" class="form-control-meet" placeholder="Ej. Conferencia Redes y Telecomunicaciones / VPN" required>
      </div>

      <div class="form-group-meet grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="form-label-meet">Fecha</label>
          <input type="date" name="scheduled_date" class="form-control-meet" value="{{ selected_date_str }}" required>
        </div>
        <div>
          <label class="form-label-meet">Hora de Inicio</label>
          <input type="time" name="start_time" class="form-control-meet" value="10:00" required>
        </div>
      </div>

      <div class="form-group-meet">
        <label class="form-label-meet">Hora de Finalización</label>
        <input type="time" name="end_time" class="form-control-meet" value="11:00" required>
      </div>

      <div class="form-group-meet">
        <label class="form-label-meet">Descripción o Temario (Opcional)</label>
        <textarea name="description" class="form-control-meet" rows="3" placeholder="Puntos a tratar en la sesión..."></textarea>
      </div>

      <!-- Configuración de VPN -->
      <div class="form-group-meet" style="background-color: #f0f4f8; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px 18px;">
        <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--navy-darker);">
          <input type="checkbox" name="requires_vpn" checked style="width: 18px; height: 18px; accent-color: #1e40af;">
          <span>Exigir conexión al Servidor Seguro mediante VPN</span>
        </label>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px; margin-left: 30px;">
          Solo usuarios dentro de la subred VPN autorizada ({{ vpn_info.subnet_prefix }}x) podrán ingresar.
        </p>
      </div>

      <div class="flex flex-wrap sm:flex-nowrap justify-end gap-3 mt-6">
        <button type="button" class="btn-card-copy flex-1 sm:flex-initial justify-center" onclick="document.getElementById('scheduleModal').classList.remove('show')">Cancelar</button>
        <button type="submit" class="btn-card-start flex-1 sm:flex-initial justify-center" style="padding: 10px 24px;">Guardar sesión</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal para compartir enlace de reunión creada -->
<div class="modal-backdrop" id="shareModal">
  <div class="modal-box-meet" style="width: 500px; padding: 26px;">
    <h3 style="font-size: 20px; font-weight: 700; color: var(--navy-darker); margin-bottom: 8px;">Sesión Lista para Transmitir</h3>
    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;">
      Comparte este enlace seguro con los participantes autorizados.
    </p>

    <div style="background-color: #f1f5f9; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border: 1px solid var(--border-medium);">
      <input type="text" id="shareMeetingLink" readonly style="background: transparent; border: none; outline: none; width: 85%; font-family: monospace; font-size: 14px; color: var(--navy-primary); font-weight: 600;">
      <button type="button" id="btnCopyShareLink" class="icon-btn" style="background: #1e40af; color: #ffffff;" title="Copiar vínculo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">
      Código de sesión: <strong id="shareMeetingCode" style="color: var(--navy-accent); font-family: monospace;"></strong>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <button type="button" class="btn-card-start" id="btnCloseShareModal" style="padding: 9px 26px;">Listo</button>
    </div>
  </div>
</div>
